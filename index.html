<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);

--serif:'Instrument Serif',Georgia,'Times New Roman',serif;--sans:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 96px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:#f8f7f4;color:#000;font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ul,dl,dd{margin:0}
ul{padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #000;outline-offset:3px}
.skip{position:absolute;left:-999px;top:8px;background:#000;color:#fff;padding:10px 16px;border-radius:999px;z-index:100}

.wrap{max-width:1240px;margin:0 auto;padding-left:32px;padding-right:32px}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.02em}
h1.serif{font-size:clamp(50px,7.2vw,104px);line-height:.96}
h2.serif{font-size:clamp(36px,4.4vw,64px);line-height:1.03}
h3.serif{font-size:32px;line-height:1.05}
.lead{font-size:20px;color:var(--mute);max-width:52ch}
.mute{color:var(--mute)}.sm{font-size:14px}.req{font-weight:400;color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 32px;border-radius:999px;border:1.5px solid #000;background:#000;color:#fff;font-weight:600;font-size:16px;white-space:nowrap;transition:background .15s,color .15s}

.btn.white{background:#f8f7f4;color:#000;border-color:#f8f7f4}.btn.white:hover{background:var(--soft2)}

.ctas{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* header */

.logo small{display:block;font-size:12px;color:var(--mute);margin-top:3px}
.nav{display:flex;gap:4px}

.nav a:hover{background:var(--soft)}
.nav a[aria-current=page]{background:#000;color:#fff}
.hsearch{margin-left:auto;position:relative;width:min(232px,19vw);min-width:180px}
.hsearch input{width:100%;height:44px;border-radius:999px;border:0;background:var(--soft);padding:0 16px 0 44px;font:inherit;font-size:15px}

.mnav.open{display:block}

/* hero */

.spec{background:var(--soft);border-radius:32px;padding:20px}
.tabs{display:flex;gap:6px;background:var(--bg);border-radius:999px;padding:6px}
.tabs button{flex:1;height:48px;border:0;border-radius:999px;background:transparent;font-weight:600;font-size:16px}
.tabs button[aria-pressed=true]{background:#000;color:#fff}
.specbody{display:grid;grid-template-columns:190px minmax(0,1fr);gap:28px;align-items:center;padding:28px 12px 12px}

.dl div{display:flex;gap:14px;padding:10px 0;border-top:1px solid #d9d9d9}

.chip:hover{border-color:#000}.chip small{color:var(--mute);font-weight:500}
.chip[aria-pressed=true]{background:#000;color:#fff;border-color:#000}.chip[aria-pressed=true] small{color:#ccc}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.panel{border-radius:32px;padding:48px;display:flex;flex-direction:column;gap:22px;min-height:460px}
.panel.soft{background:var(--soft)}.panel.dark{background:#000;color:#fff}
.panel h3{font-size:clamp(36px,4vw,54px);line-height:1}
.panel .ticks{display:flex;flex-direction:column;gap:12px}
.panel .ticks li{display:flex;gap:12px;align-items:center}
.panel .btn{align-self:flex-start;margin-top:auto}
.contact-strip{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:center;background:var(--soft);border-radius:32px;padding:48px}

/* cards */
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px 24px}
.pgrid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{display:flex;flex-direction:column;gap:16px;transition:transform .3s ease}
.card:hover{transform:translateY(-4px)}
.card .art{background:var(--soft);border-radius:20px;aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden;transition:background .2s ease}

.art svg{filter:none}
.art svg.art-Phone{height:70%;width:auto}.art svg.art-Tablet{height:64%;width:auto}.art svg.art-Laptop{width:74%;height:auto}

.price{font-size:20px;font-weight:600}
.dots{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}

/* shop */
.shop{display:grid;grid-template-columns:250px minmax(0,1fr);gap:56px;padding-top:40px;padding-bottom:96px}
.side{display:flex;flex-direction:column;gap:30px;position:sticky;top:104px;align-self:start}

.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.empty{background:var(--soft);border-radius:28px;padding:48px;display:flex;flex-direction:column;gap:12px}

/* device */
.crumb{display:flex;gap:10px;font-size:14px;color:var(--mute);padding:24px 0 8px;flex-wrap:wrap}
.crumb a:hover{color:#000}.crumb b{color:#000;font-weight:600}
.dev{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.92fr);gap:64px;padding-top:24px;padding-bottom:96px}
.devart{background:var(--soft);border-radius:32px;min-height:680px;display:grid;place-items:center;position:sticky;top:104px;align-self:start}
.devart svg{filter:none}
@keyframes colorPop{0%{transform:scale(.94);opacity:.5}40%{transform:scale(1.03);opacity:1}100%{transform:scale(1);opacity:1}}
.devart svg{animation:colorPop .55s cubic-bezier(.16,1,.3,1) both}
.specart svg{animation:colorPop .55s cubic-bezier(.16,1,.3,1) both}
.card .art svg{animation:colorPop .4s cubic-bezier(.16,1,.3,1) both}
.devart svg.art-Phone{height:520px;width:auto}.devart svg.art-Tablet{height:480px;width:auto}.devart svg.art-Laptop{width:min(520px,80%);height:auto}
.devinfo{display:flex;flex-direction:column;gap:28px}
.devinfo h1{font-size:clamp(44px,5vw,68px);line-height:1}
.bigprice{font-size:42px;font-weight:600;letter-spacing:-.02em;line-height:1}
.lbl{font-weight:600;font-size:15px;margin-bottom:12px}
.sw{display:flex;gap:14px;flex-wrap:wrap}
.sw button{width:42px;height:42px;border-radius:50%;border:1px solid #cfcfcf;padding:0}
.sw button[aria-pressed=true]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px #000}
.ctile{display:flex;align-items:center;gap:16px;width:100%;min-height:76px;padding:14px 20px;border-radius:18px;border:1px solid var(--line);background:var(--bg);text-align:left}

.ctile .tt b{font-size:18px}.ctile .tt span{font-size:14px;color:var(--mute)}
.ctile .pp{font-weight:600;font-size:17px}
.clist{display:flex;flex-direction:column;gap:10px}
.clist.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.clist.row .ctile{flex-direction:column;align-items:flex-start;gap:8px;min-height:110px}
.cdetail{background:var(--soft);border-radius:24px;padding:26px;margin-top:14px;display:flex;flex-direction:column;gap:14px}
.cdetail h4{font-family:var(--serif);font-weight:400;font-size:32px;letter-spacing:-.01em;line-height:1}
.cdetail .top2{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.cdetail p{font-size:15px;color:#333}

/* forms */
.box{border:1px solid var(--line);border-radius:28px;padding:32px;display:flex;flex-direction:column;gap:24px}
.box.sent{background:var(--soft);border-color:var(--soft)}
.bh{display:flex;gap:16px;align-items:center}
.bn{width:36px;height:36px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;font-weight:600;flex:none}
.fld{display:flex;flex-direction:column;gap:8px}
.fld label,.fld .lb{font-size:14px;font-weight:600}
input,select,textarea{font:inherit;font-size:16px;color:#000}
.fld input,.fld select,.fld textarea{width:100%;min-height:52px;border:1px solid #cfcfcf;border-radius:14px;padding:0 16px;background:#fff}
.fld textarea{padding:14px 16px;resize:vertical;line-height:1.5}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid #000;outline-offset:0;border-color:#000}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.seg{display:flex;flex-wrap:wrap;gap:10px}
.seg button{height:48px;padding:0 20px;border-radius:14px;border:1px solid #cfcfcf;background:#fff;font-weight:600;font-size:15px}
.seg button:hover{border-color:#000}
.seg button[aria-pressed=true]{border-color:#000;box-shadow:0 0 0 1px #000}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:22px;border-radius:20px;border:1px solid var(--line);background:#fff;text-align:left}
.opt:hover{border-color:#999}
.opt[aria-pressed=true]{border-color:#000;box-shadow:0 0 0 1px #000}

.note{background:var(--soft);border-radius:14px;padding:14px 16px;font-size:15px}

.stack{display:flex;flex-direction:column;gap:24px}

.pagehead{padding-top:72px;padding-bottom:48px;display:flex;flex-direction:column;gap:22px}

.steps{display:flex;flex-direction:column}

/* ---------- cookie notice ---------- */
.ckb{position:fixed;left:16px;right:16px;bottom:16px;z-index:70;background:#000;color:#fff;border-radius:16px;
  padding:16px 18px;box-shadow:0 18px 50px rgba(0,0,0,.34);animation:ckbIn .5s cubic-bezier(.2,.8,.2,1) .7s both;
  max-width:760px;margin-inline:auto}

.ckb .btn.sm:hover{transform:translateY(-1px)}

/* ---------- extra motion ---------- */
.logo .mark{transition:transform .45s cubic-bezier(.2,.8,.2,1),border-radius .45s}

}

/* ============================================================
   BRAND THEME - BLACK, WHITE AND YELLOW
   Deliberately plain and retail-standard: one accent colour, flat
   fills, thin rules, no gradients. Yellow is used only to mark the
   thing you are meant to press or notice.
   ============================================================ */
:root{
  --y:#ffd60a;          /* brand yellow */
  --y-d:#e6bf00;        /* pressed yellow */
  --ink:#000;
  --ink-2:#3d3d3d;
  --line:#e0ddd8;
  --paper:#f8f7f4;
  --wash:#f2f1ed;
}
body{background:var(--paper);color:var(--ink)}

/* --- type: plain bold sans, no gradient text --- */
.serif{font-family:var(--sans)!important;font-weight:800!important;letter-spacing:-.02em}
h1.serif,h2.serif{line-height:1.05}
.hero h1 .ln>span{background:none;-webkit-text-fill-color:currentColor;color:var(--ink)}
.nf-in h1,.legal h1{background:none;-webkit-text-fill-color:currentColor;color:var(--ink)}
.eyebrow{color:var(--ink-2);font-weight:700;letter-spacing:.12em}

/* --- announcement bar: yellow, black text --- */
.top{background:var(--y);color:var(--ink);animation:none;font-weight:700}
.top a{color:var(--ink);font-weight:700}
.topin{font-size:13.5px}

/* --- header: black --- */
.hbar{background:var(--ink);border-bottom:0;box-shadow:none}
.hbar,.hbar a,.hbar b,.hbar button{color:#fff}
.hbar small{color:#a8a8a8}
.logo .mark{background:var(--y);color:var(--ink);box-shadow:none}
.logo b{background:none;-webkit-text-fill-color:#fff;color:#fff}
.nav a{font-weight:600}
.nav a::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;border-radius:0;
  background:var(--y);transform:scaleX(0);transform-origin:left;transition:transform .25s ease}
.nav a:hover::after,.nav a[aria-current=page]::after{transform:scaleX(1)}
.hsearch{background:var(--bg);border:1px solid var(--bg);border-radius:8px}
.hsearch input,.hsearch input:focus{color:#000;-webkit-text-fill-color:#000}
.hsearch input::placeholder{color:#6b6b6b}
.hsearch svg,.hsearch button{color:#000;stroke:#000}
.hask{background:var(--y);border:0;color:var(--ink);font-weight:700}
.hask:hover{background:#fff}
.hbar .cartbtn{background:transparent;border:1px solid #3a3a3a;color:#fff;border-radius:8px}
.hbar .cartbtn:hover{background:var(--y);border-color:var(--y);color:var(--ink)}
.hbar .cartbtn svg{stroke:currentColor}
.hbar .cartbtn .cnum{background:var(--y);color:var(--ink);font-weight:800}
.burger{color:#fff}
.mnav{background:var(--ink)}
.mnav a{color:#fff}

/* --- shop by category strip --- */
.catnav{background:#f8f7f4;border-bottom:1px solid var(--line);overflow:hidden}
.catnav-in{display:flex;align-items:center;gap:8px;max-width:1240px;margin:0 auto;
  padding:10px 32px;overflow-x:auto;scrollbar-width:none}
.catnav-in::-webkit-scrollbar{display:none}
.catnav-lbl{color:var(--ink-2);font-size:11.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.1em;flex:none;padding-right:6px}
.cpill{flex:none;display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:6px;
  font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;
  background:#fff;border:1px solid var(--line);transition:background .18s,border-color .18s,color .18s}
.cpill small{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--wash);color:var(--ink-2)}
.cpill:hover,.cpill.on{background:var(--y);border-color:var(--y);color:var(--ink)}
.cpill:hover small,.cpill.on small{background:rgba(0,0,0,.12);color:var(--ink)}
@media(max-width:640px){.catnav-lbl{display:none}.catnav-in{padding:9px 16px}}

/* --- buttons --- */
.btn{border-radius:8px;font-weight:700}
.btn:not(.ghost){background:var(--y);color:var(--ink);border:1px solid var(--y);box-shadow:none}
.btn:not(.ghost):hover{background:var(--y-d);border-color:var(--y-d);transform:none}
.btn.ghost{border:1px solid var(--ink);color:var(--ink);font-weight:700;background:#fff}
.btn.ghost:hover{background:var(--ink);color:#fff}

/* --- hero: quiet --- */
.hero::before{display:none}
.hero{background:var(--paper)}

/* --- category tiles --- */
.cats .cat{border-radius:12px;border:1px solid var(--line);overflow:hidden;
  transition:border-color .2s,box-shadow .2s}
.cats .cat:hover{transform:none;border-color:var(--ink);box-shadow:none}
.cats .cat .cart,
.cats .cat:nth-child(1) .cart,
.cats .cat:nth-child(2) .cart,
.cats .cat:nth-child(3) .cart{background:var(--wash)}

/* --- product cards --- */
.card{position:relative;border-radius:12px;border:1px solid var(--line);overflow:hidden;background:#fff;
  transition:border-color .2s,box-shadow .2s,transform .2s}
.card .cinfo{padding:0 16px 16px}
.card .dots{flex-wrap:wrap;gap:5px;margin-top:8px}
.card .dots i{width:12px;height:12px}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;z-index:2;background:var(--y);
  transform:scaleX(0);transform-origin:left;transition:transform .25s ease}
.card:hover{transform:translateY(-3px);border-color:var(--ink);box-shadow:0 10px 26px -18px rgba(0,0,0,.5)}
.card:hover::before{transform:scaleX(1)}
.card .art{background:var(--wash)}
.card .price{font-weight:800;font-size:20px;background:none;-webkit-text-fill-color:var(--ink);color:var(--ink)}
.card .dots i{box-shadow:0 0 0 1.5px #fff,0 0 0 2.5px rgba(0,0,0,.18)}
.photo{mix-blend-mode:normal}

/* --- badges --- */
.badge{background:var(--y);color:var(--ink);font-weight:700;border-radius:4px;padding:3px 8px;
  font-size:11px;letter-spacing:0;border:0}
.badge.low{background:var(--y);color:var(--ink)}
.badge.sold{background:var(--ink);color:#fff}

/* --- chips / filters --- */
.brands .chip,.chip{border-radius:6px;font-weight:600;border:1px solid var(--line);transition:all .18s}
.brands .chip:hover,.chip:hover{background:var(--wash);border-color:var(--ink)}
.chip[aria-pressed=true]{background:var(--y);border-color:var(--y);color:var(--ink)}
.tabs button[aria-pressed=true]{background:var(--ink);color:#fff}

/* --- swatches --- */
.sw button{transition:box-shadow .18s,transform .18s}
.sw button:hover{transform:scale(1.08)}
.sw button[aria-pressed=true]{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}

/* --- trust row --- */
.trust .tic,
.trust .ti:nth-child(1) .tic,.trust .ti:nth-child(2) .tic,
.trust .ti:nth-child(3) .tic,.trust .ti:nth-child(4) .tic{background:var(--y);color:var(--ink);border-radius:8px}

/* --- ticker --- */
.ticker{background:var(--ink);color:#fff}
.ticker .tk span{color:#fff;opacity:.85;font-weight:600}

/* --- headings --- */
.sech h2{font-size:clamp(24px,3vw,36px)}

/* --- footer: black --- */
.foot{background:var(--ink);color:#fff}
.foot,.foot a,.foot h4,.foot b{color:#fff}
.foot .mute,.foot .sm.mute,.foot small{color:#a0a0a0}
.foot .fbot{color:#a0a0a0}
.foot h4{font-weight:700;letter-spacing:.04em}
.foot a:hover{color:var(--y)}
.foot .mark{background:var(--y);color:var(--ink)}
.fbot{border-top:1px solid #262626;color:#a0a0a0}
.fbot a{text-decoration:underline}

/* --- supplied photo with generated-art fallback --- */
.picwrap{position:relative;display:grid;place-items:center;width:100%;height:100%}
.picwrap .picart{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .2s}
.picwrap.picfail .picart{opacity:1;position:relative}
.picwrap .photo{position:relative;z-index:1}
.picwrap .picart svg{max-width:88%;max-height:88%}

/* --- "More" menu: three lines, shown at every width --- */
.burger{display:grid!important;place-items:center;width:44px;height:44px;flex:none;
  border-radius:10px;border:1px solid #3a3a3a;background:transparent;cursor:pointer;
  margin-left:4px;transition:background .18s ease,border-color .18s ease}
.burger:hover{background:var(--y);border-color:var(--y)}
.burger:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.blines{display:grid;gap:4px;width:20px}
.blines i{display:block;height:2.4px;width:100%;background:#fff;border-radius:2px;
  transition:transform .26s cubic-bezier(.16,1,.3,1),opacity .18s ease,background .18s ease}
.burger:hover .blines i{background:#000}
.burger[aria-expanded="true"] .blines i:nth-child(1){transform:translateY(6.4px) rotate(45deg)}
.burger[aria-expanded="true"] .blines i:nth-child(2){opacity:0}
.burger[aria-expanded="true"] .blines i:nth-child(3){transform:translateY(-6.4px) rotate(-45deg)}
.mnav{display:none;background:var(--ink);border-top:1px solid #2a2a2a;padding:0}
.mnav.open{display:block;animation:mnavIn .3s cubic-bezier(.16,1,.3,1) both}
@keyframes mnavIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.msearch input{width:100%;height:42px;border-radius:8px;border:1px solid #333;background:#111;color:#fff;font:inherit;padding:0 14px;margin-bottom:8px}
.msearch input::placeholder{color:#888}
.mnavin{display:grid;grid-template-columns:repeat(5,1fr);gap:28px;padding-top:28px;padding-bottom:32px}
.mncol h4{color:var(--y);font-size:12px;letter-spacing:.09em;text-transform:uppercase;margin:0 0 10px}
.mncol a,.mncol .mnbtn{display:block;height:auto;padding:9px 0;color:#fff;font-weight:600;font-size:15px;
  border-bottom:1px solid #262626;background:none;border-left:0;border-right:0;border-top:0;
  width:100%;text-align:left;font-family:inherit;cursor:pointer;transition:color .16s ease,padding-left .16s ease}
.mncol a:hover,.mncol .mnbtn:hover{color:var(--y);padding-left:6px}
@media(max-width:1180px){.mnavin{grid-template-columns:repeat(3,1fr);gap:22px}}
@media(max-width:820px){.mnavin{grid-template-columns:1fr 1fr;gap:18px}}
@media(max-width:620px){.mnavin{grid-template-columns:1fr;gap:10px;padding-top:18px;padding-bottom:22px}}
@media(prefers-reduced-motion:reduce){.mnav.open{animation:none}.blines i{transition:none}}

/* --- gallery colour view --- */
.galartv{grid-area:1/1;display:grid;place-items:center;animation:galIn .6s cubic-bezier(.16,1,.3,1) both}
.galartv.swapin{animation:galSwap .45s cubic-bezier(.16,1,.3,1) both}
.galartv[hidden]{display:none}
.galartv svg.art-Phone{height:500px;width:auto}
.galartv svg.art-Tablet{height:460px;width:auto}

.galtabs button{white-space:nowrap}
.galtabs{max-width:100%}
@media(max-width:520px){.galtabs button{font-size:13px;padding-left:12px;padding-right:12px}}

}

.galstage.nophoto{display:grid;place-items:center;position:relative}
.galstage.nophoto .galartv{position:static}
/* --- cookie notice --- */
.ckb{background:var(--ink);border:1px solid #2b2b2b;color:#fff}
.ckb a{color:var(--y)}

.devinfo .badge,.stack>.badge{align-self:flex-start;width:auto;display:inline-flex}
:root{--accent:var(--y)}
.editor-bar .eb-add{background:var(--y)!important;color:#000!important;font-weight:700}
.pttoast{position:fixed;left:50%;top:84px;transform:translate(-50%,-20px);z-index:99999;background:#000;color:#fff;border-left:4px solid var(--y);padding:14px 20px;border-radius:10px;font-weight:600;font-size:15px;box-shadow:0 14px 40px -12px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:min(560px,92vw)}
.pttoast.show{opacity:1;transform:translate(-50%,0)}

/* hero right: featured devices */
.hero-r{display:flex;flex-direction:column;gap:16px;min-width:0}

.hr-tile:hover{transform:translateY(-2px);box-shadow:0 14px 30px -18px rgba(0,0,0,.35)}

.hr-img{height:clamp(200px,24vw,300px);display:grid;place-items:center;background:#fff;overflow:hidden}

/* ===== PLAIN FINISH: removes the common "vibecoded" patterns ===== */
/* Sharp, consistent corners instead of soft pill/bubble radii */
*,*::before,*::after{border-radius:2px!important}
.sw button,.ctile .rd,.ctile .rd::after,.x,.chatbtn,.cimg,.sn,.dot,.avatar{border-radius:50%!important}
/* No drop shadows, no glass blur */
*,*::before,*::after{box-shadow:none!important;text-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.hbar{background:var(--ink)!important}
@media(max-width:1180px){.hbar .nav{display:none}}

@media(max-width:1320px) and (min-width:1181px){.hbar .hask{margin-left:auto}}
.dlg,.chatp,.drawer,.pttoast,.est{border:1px solid var(--ink)!important}
.sw button[aria-pressed=true]{outline:2px solid #000;outline-offset:3px}
.ctile[aria-pressed=true]{outline:1px solid #000;outline-offset:-2px}
/* No gradients, orbs, dot grids or sheen */
.ct-pristine,.ct-excellent,.ct-good,.cd-pristine,.cd-excellent,.cd-good,.nlband,.panel.dark,[class^="sp-"],[class*=" sp-"]{background-image:none!important}
.ct-pristine,.ct-excellent,.ct-good{background-color:var(--paper)!important}

.cd-good{background-color:var(--ink)!important}

.ticker{display:none!important}
.ticker+.wrap .trust{border-top:1px solid var(--line)}

*,*::before,*::after{animation:none!important;transition-property:color,background-color,border-color,text-decoration-color,opacity!important;transition-duration:.12s!important;transition-delay:0s!important}
.drawer{transition-property:transform!important;transition-duration:.2s!important}
html:not(.mo) .rv{opacity:1!important;transform:none!important}
.mo .rv{opacity:1;transform:none;transition:none!important}
a:hover,button:hover,.card:hover,.cat:hover,.ctile:hover,.nlband:hover,.btn:hover,.chip:hover,.hr-tile:hover,
a:hover *,button:hover *,.card:hover *,.cat:hover *,.nlband:hover *,.hr-tile:hover *{transform:none!important;translate:none!important;scale:none!important;rotate:none!important}
.btn:hover{background:var(--ink-2,#222);border-color:var(--ink-2,#222)}
.btn.ghost:hover,.btn.white:hover{background:var(--wash)}
/* ===== Shop/listing polish: smoother card motion, scoped to product cards only.
   The rules just above intentionally strip hover/transition/animation site-wide;
   these overrides win (equal !important, higher specificity) but only for
   .pgrid .card, so every other component keeps the deliberate plain look. ===== */
@media (prefers-reduced-motion:no-preference){

  .pgrid .card:nth-child(1){animation-delay:.02s!important}

  .pgrid .card:nth-child(3){animation-delay:.08s!important}
  .pgrid .card:nth-child(4){animation-delay:.11s!important}
  .pgrid .card:nth-child(n+5){animation-delay:.13s!important}
  @keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .pgrid .card{transition-property:transform,box-shadow!important;transition-duration:.35s!important;transition-timing-function:cubic-bezier(.16,1,.3,1)!important}
  .pgrid .card:hover{transform:translateY(-5px)!important;box-shadow:0 18px 32px -22px rgba(0,0,0,.45)!important}
  .pgrid .card:active{transform:translateY(-2px) scale(.99)!important;transition-duration:.12s!important}
  .pgrid .card .art img,.pgrid .card .art svg{transition:transform .45s cubic-bezier(.2,.7,.2,1)!important}
  .pgrid .card:hover .art img,.pgrid .card:hover .art svg{transform:scale(1.045)!important}
}
a.lnk:hover,.card:hover h3,.cat:hover h3{text-decoration:underline;text-underline-offset:3px}

.ticks svg,.hr-trust svg,.elig li svg{display:none!important}

/* ===== FIXES: header search / Ask button, cookie bar, hero text legibility ===== */
/* 1. Header. The search field used to be allowed to shrink to nothing, which left a
   thin sliver jammed against the Ask PhoneTrade button. It now keeps a real minimum
   width, and lower-priority items give up room first (everything hidden here is still
   in the More menu). */
.hbar .hin{min-width:0}
.hbar .hsearch{flex:0 1 240px;width:auto;min-width:150px;margin-left:auto}
.hbar .hask{flex:none;white-space:nowrap;margin-left:0}
.hbar .nav{flex:none}
.hbar .logo{flex:none}
.hbar .cartbtn,.hbar .burger{flex:none}
/* The page is centred in a 1240px column, so the header has 1176px to work with on any
   wide screen. Shop, Accessories, Sell, Trade in and Contact stay in the bar; "How we
   grade" and "Can't find it?" live in the More menu, and Ask PhoneTrade shortens to
   "Ask". That leaves the search field a proper width. (Attribute selectors end-match
   the path so they work for both #/route and /route links.) */
@media(min-width:1181px){
  .hbar .hsearch{display:block}
  .hbar .nav a[href$="/grading"],.hbar .nav a[href$="/not-listed"]{display:none}
  .hbar .hask-x{display:none}.hbar .hask{padding:0 14px}
}

/* 2. Cookie notice: a slim bar docked to the bottom instead of a big card that sat
   on top of the hero text. Its height is published as --ckh so the hero can make room. */
.ckb{left:0!important;right:0!important;bottom:0!important;max-width:none!important;margin:0!important;border-radius:0!important;padding:10px 20px!important;border-width:1px 0 0!important}
.ckb-in{flex-wrap:nowrap;gap:8px 20px;max-width:1240px;margin:0 auto}
.ckb p{font-size:13.5px;line-height:1.4;max-width:none;flex:1 1 auto;margin:0}
.ckb .btn.sm{min-height:38px;padding:6px 14px}
@media(max-width:639px){
  .ckb{padding:10px 14px!important}
  .ckb-in{gap:10px}
  .ckb p{font-size:12.5px;line-height:1.35}
  .ckb .ckx{display:none}
  .ckb .btn.ghost.sm{display:none}
  /* keep text and the Got it button on one row (an older rule stacked them) */
  .ckb-in{flex-direction:row;align-items:center}
  .ckb-btns{width:auto}
  .ckb .btn.sm{flex:none;min-height:40px;padding:6px 16px}
}
/* the chat bubble sits above the cookie bar instead of underneath it */
.chatbtn{bottom:calc(var(--ckh,0px) + 24px + env(safe-area-inset-bottom,0px));transition:bottom .3s ease}
@media(max-width:640px){.chatbtn{bottom:calc(var(--ckh,0px) + 16px + env(safe-area-inset-bottom,0px))}}

/* 3. Hero. GRADED is back to its original full size. Instead of shrinking it to
   dodge the text, the model name and price now sit on their own solid card in
   the slide's own colour, so they read cleanly no matter how big the ghost
   word is or what part of it sits behind them. The card also lifts clear of
   the cookie bar automatically. */
#xh .xh-bl{bottom:calc(var(--ckh,0px) + 20px);transition:bottom .3s ease}
#xh .xh-txt{background:var(--xhc);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:14px 16px;border-radius:2px;display:inline-block;max-width:calc(100% - 8px);
  box-shadow:0 1px 0 rgba(0,0,0,.06)}
@media(min-width:640px){
  #xh .xh-bl{bottom:calc(var(--ckh,0px) + 40px)}
  #xh .xh-go{bottom:calc(var(--ckh,0px) + 48px);right:100px}
  #xh .xh-txt{padding:20px 26px}
}
@media(min-width:640px) and (max-width:1099px){
  /* tablet: move the big phone right so it stops sitting behind the text card */
  #xh .xh-it[data-r=c]{left:68%;height:58%}
  #xh .xh-it[data-r=l]{opacity:0}
}
@media(min-width:1100px){
  #xh .xh-bl{bottom:calc(var(--ckh,0px) + 72px)}
  #xh .xh-go{bottom:112px}
}
@media(max-width:639px){
  /* keep the phone above the text while the cookie bar is showing */
  #xh .xh-it[data-r=c]{bottom:calc(29% + var(--ckh,0px)*.9);height:calc(40% - var(--ckh,0px)*.9)}
}
